apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    {{- range $key, $val := .Values.ingress.annotations }}
    {{ $key }}: {{ $val | quote }}
    {{- end }}
spec:
  ingressClassName: alb
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.frontend.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.frontend.service }}
                port:
                  number: {{ .Values.ingress.frontend.port }}
          - path: {{ .Values.ingress.backend.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.backend.service }}
                port:
                  number: {{ .Values.ingress.backend.port }}
